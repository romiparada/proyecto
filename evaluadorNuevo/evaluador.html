<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eval semi-automático</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000;
        }

        .app-container {
            display: flex;
            gap: 20px;
            height: 85vh;
        }

        .sidebar {
            width: 300px;
            border: 1px solid #000;
            overflow-y: auto;
            padding: 10px;
        }

        .main-content {
            flex: 1;
            border: 1px solid #000;
            overflow-y: auto;
            padding: 20px;
        }

        .list-item {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
        }

        .list-item:hover {
            background: #f0f0f0;
        }

        .list-item.active {
            background: #d0d0d0;
            border-left: 4px solid #000;
            font-weight: bold;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 1px solid #000;
            margin-right: 5px;
        }

        .status-indicator.done {
            background-color: #000;
        }

        .card {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            background: #f9f9f9;
        }

        .header-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            border-bottom: 1px solid #999;
            padding-bottom: 5px;
        }

        .btn {
            padding: 10px 15px;
            cursor: pointer;
            border: 1px solid #000;
            background: #eee;
            font-size: 1em;
        }

        .btn:hover {
            background: #ddd;
        }

        .options-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .option-btn {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border: 1px solid #888;
            background: #fff;
        }

        .option-btn.selected {
            background: #333;
            color: #fff;
            border-color: #000;
        }

        .predictions-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .prediction-card {
            border: 1px dashed #666;
            padding: 10px;
            cursor: pointer;
            background: #fff;
        }

        .prediction-card:hover {
            background: #fdfdfd;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #000;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <h2 id="mainTitle">Evaluador</h2>
        <div>
            <span id="statsText" style="margin-right: 15px;">Progreso: 0 / 0</span>
            <input type="file" id="csvFileInput" accept=".csv" class="btn" />
            <button id="exportBtn" class="btn hidden">Guardar Evaluación (Exportar CSV)</button>
        </div>
    </div>

    <div id="emptyState" style="text-align: center; margin-top: 100px;">
        <h3>Por favor, selecciona un archivo CSV local para comenzar.</h3>
        <p>No se necesita servidor. Todo corre local y se guarda como descarga.</p>
    </div>

    <div id="contentWrapper" class="app-container hidden">
        <div class="sidebar">
            <h3 id="sidebarHeader">Elementos</h3>
            <div id="itemList"></div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="header-title" id="mainLabel">Elemento Evaluado</div>
                <div id="mainText" style="font-size: 1.1em; white-space: pre-wrap;"></div>
            </div>

            <div class="card">
                <div class="header-title">Clasificación Manual</div>
                <div class="options-group" id="optionsGroup"></div>

                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold;">Correspondencias Reales (IDs enteros separados por comas):</label>
                    <input type="text" id="matchesInput" placeholder="Ej: 1, 4, 15 (o texto libre según el modo)" />
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold;">Notas adicionales:</label>
                    <input type="text" id="notesInput" placeholder="Anotaciones extra..." />
                </div>
            </div>

            <div class="card">
                <div class="header-title">Posibles Coincidencias</div>
                <div id="predictionsGrid" class="predictions-grid"></div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <button class="btn" onclick="nav(-1)">&laquo; Anterior</button>
                <button class="btn" onclick="nav(1)">Siguiente &raquo;</button>
            </div>
        </div>
    </div>

        function getRef(text) {
            if (!text) return '';
            let cleanText = text.replace(/\s*\\hline/g, '').trim();
            for (let cat in textRefs) {
                if (textRefs[cat][cleanText]) return textRefs[cat][cleanText];
            }
            // fallback by inclusion
            for (let cat in textRefs) {
                for (let key in textRefs[cat]) {
                    if (key.includes(cleanText) || cleanText.includes(key)) {
                        return textRefs[cat][key];
                    }
                }
            }
            return '';
        }

        function formatWithRef(text) {
            if (!text) return '';
            let ref = getRef(text);
            return ref ? `[${ref}] ${text}` : text;

            idCol: 'ID_Hist_Generada', mainTextLbl: 'Criterio de Aceptación Generado', mainTextCol: 'CA_Generado',
            simCols: ['CA_Esp_1', 'CA_Esp_2', 'CA_Esp_3'], simScores: ['Sim_1', 'Sim_2', 'Sim_3'], simSources: ['Hist_Esp_1', 'Hist_Esp_2', 'Hist_Esp_3'],
            classCol: null, evalCol: 'Correspondencias Reales (IDs)', noteCol: 'Notas', options: null, multiSelect: true, defaultVisible: 3, defaultSaveName: 'evaluacion_ca_revisada.csv',
            title: 'Análisis de Similitud de Criterios Generados vs Criterios Esperados'
        };

        const MODE_ALUCINACION = {
            idCol: 'ID Hist Generada', mainTextLbl: 'Historia Generada', mainTextCol: 'Historia Generada',
            simCols: ['Historia Esperada Mejor'],
            classCol: 'Clasificacion Alucinacion', evalCol: 'Notas', noteCol: 'Notas',
            options: ['Alucinación', 'No Alucinación'], multiSelect: false, defaultVisible: 1, defaultSaveName: 'hallucination_report_revisado.csv',
            title: 'Análisis de Alucinaciones'
        };

        let appState = { modeInfo: null, rows: [], cols: [], currentIndex: 0, saveName: 'export.csv' };

        const dom = {
            input: document.getElementById('csvFileInput'), exportBtn: document.getElementById('exportBtn'),
            emptyState: document.getElementById('emptyState'), wrapper: document.getElementById('contentWrapper'),
            itemList: document.getElementById('itemList'), mainLabel: document.getElementById('mainLabel'), mainText: document.getElementById('mainText'),
            predictionsGrid: document.getElementById('predictionsGrid'), optionsGroup: document.getElementById('optionsGroup'),
            matchesInput: document.getElementById('matchesInput'), notesInput: document.getElementById('notesInput'),
            statsText: document.getElementById('statsText'), mainTitle: document.getElementById('mainTitle')
        };

        dom.input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                parseCSV(text);
                if (appState.rows.length > 0) {
                    dom.emptyState.classList.add('hidden');
                    dom.wrapper.classList.remove('hidden');
                    dom.exportBtn.classList.remove('hidden');
                    appState.currentIndex = 0;
                    renderSidebar();
                    loadItem(0);
                    updateStats();
                }
            };
            reader.readAsText(file);
        });

        dom.exportBtn.addEventListener('click', () => {
            let csvContent = appState.cols.join(';') + '\n' + appState.rows.map(row => appState.cols.map(c => `"${(row[c] || '').replace(/"/g, '""')}"`).join(';')).join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = appState.modeInfo.defaultSaveName;
            a.click();
        });

        dom.notesInput.addEventListener('input', () => { saveCurrentState(); });
        dom.matchesInput.addEventListener('input', () => { saveCurrentState(); updateStats(); renderPredictionsGrid(); });

        function parseCSV(text) {
            const lines = text.split('\n');
            if (lines.length < 1) return;
            appState.cols = lines[0].split(';').map(c => c.trim().replace(/^"|"$/g, ''));
            const dataLines = lines.slice(1).filter(l => l.trim() !== '');
            appState.rows = dataLines.map(line => {
                const values = []; let inQuotes = false; let curr = '';
                for (let i = 0; i < line.length; i++) {
                    const c = line[i];
                    if (c === '"') { inQuotes = !inQuotes; }
                    else if (c === ';' && !inQuotes) { values.push(curr); curr = ''; }
                    else { curr += c; }
                }
                values.push(curr);
                const obj = {};
                appState.cols.forEach((c, idx) => { obj[c] = values[idx] ? values[idx].trim() : ''; });
                return obj;
            });

            if (appState.cols.includes('Clasificacion Alucinacion')) appState.modeInfo = MODE_ALUCINACION;
            else if (appState.cols.includes('CA_Generado')) appState.modeInfo = MODE_CA;
            else if (appState.cols.includes('ID Func')) appState.modeInfo = MODE_COBERTURA;
            else appState.modeInfo = MODE_ALINEACION;

            document.getElementById('mainTitle').innerText = appState.modeInfo.title;
        }

        function isEvaluated(row) {
            if (appState.modeInfo.classCol) {
                return (row[appState.modeInfo.classCol] !== undefined && row[appState.modeInfo.classCol].trim() !== '') ||
                    (row[appState.modeInfo.evalCol] !== undefined && row[appState.modeInfo.evalCol].trim() !== '');
            }
            return row[appState.modeInfo.evalCol] !== undefined && row[appState.modeInfo.evalCol].trim() !== '';
        }

        function renderSidebar() {
            dom.itemList.innerHTML = '';
            appState.rows.forEach((row, idx) => {
                const div = document.createElement('div');
                div.className = `list-item ${idx === appState.currentIndex ? 'active' : ''}`;
                let snippet = row[appState.modeInfo.mainTextCol] || '';
                let ref = getRef(snippet);
                if (snippet.length > 50) snippet = snippet.substring(0, 50) + '...';
                if (ref) snippet = `[${ref}] ${snippet}`;
                div.innerHTML = `<span class="status-indicator ${isEvaluated(row) ? 'done' : ''}"></span> [${row[appState.modeInfo.idCol]}] ${snippet}`;
                div.onclick = () => loadItem(idx);
                dom.itemList.appendChild(div);
            });
        }

        function updateStats() {
            const done = appState.rows.filter(r => isEvaluated(r)).length;
            dom.statsText.innerText = `Progreso: ${done} / ${appState.rows.length}`;
            Array.from(dom.itemList.children).forEach((el, idx) => {
                const marker = el.querySelector('.status-indicator');
                if (isEvaluated(appState.rows[idx])) marker.classList.add('done');
                else marker.classList.remove('done');
            });
        }

        function getSelectedIds() {
            const val = dom.matchesInput.value.trim();
            if (!val) return [];
            return val.split(',').map(s => s.trim()).filter(s => s);
        }

        function loadItem(index) {
            if (index < 0 || index >= appState.rows.length) return;
            appState.currentIndex = index;
            Array.from(dom.itemList.children).forEach((el, i) => { if (i === index) el.classList.add('active'); else el.classList.remove('active'); });
            const row = appState.rows[index];
            const m = appState.modeInfo;

            dom.mainLabel.innerText = `${m.mainTextLbl} [${row[m.idCol]}]`;
            dom.mainText.innerText = formatWithRef(row[m.mainTextCol] || 'N/A');

            const currentClass = row[m.classCol] || '';
            dom.optionsGroup.innerHTML = '';
            if (m.options) {
                dom.optionsGroup.classList.remove('hidden');
                m.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = `option-btn ${currentClass === opt ? 'selected' : ''}`;
                    btn.innerText = opt;
                    btn.dataset.val = opt;
                    btn.onclick = () => selectOption(opt);
                    dom.optionsGroup.appendChild(btn);
                });
            } else {
                dom.optionsGroup.classList.add('hidden');
            }

            dom.matchesInput.value = row[m.evalCol] || '';
            dom.notesInput.value = row[m.noteCol] || '';
            renderPredictionsGrid();
        }

        function selectOption(opt) {
            const row = appState.rows[appState.currentIndex];
            row[appState.modeInfo.classCol] = opt;
            Array.from(dom.optionsGroup.children).forEach(b => { if (b.dataset.val === opt) b.classList.add('selected'); else b.classList.remove('selected'); });
            if (appState.modeInfo.multiSelect && opt === 'Posiblemente alineada') {
                renderPredictionsGrid(true);
            } else {
                renderPredictionsGrid(false);
            }
            saveCurrentState(); updateStats();
        }

        function saveCurrentState() {
            const row = appState.rows[appState.currentIndex];
            const m = appState.modeInfo;
            row[m.evalCol] = dom.matchesInput.value;
            row[m.noteCol] = dom.notesInput.value;
        }

        function toggleMatch(idStr) {
            let sel = getSelectedIds();
            if (sel.includes(idStr)) sel = sel.filter(x => x !== idStr);
            else { if (!appState.modeInfo.multiSelect) sel = [idStr]; else sel.push(idStr); }
            dom.matchesInput.value = sel.join(', ');
            saveCurrentState(); renderPredictionsGrid(); updateStats();
        }

        function renderPredictionsGrid(showAll = false) {
            dom.predictionsGrid.innerHTML = '';
            const row = appState.rows[appState.currentIndex];
            const m = appState.modeInfo;
            const selIds = getSelectedIds();
            const shouldShowAll = m.multiSelect && ((row[m.classCol] || '') === 'Posiblemente alineada' || showAll);
            const limit = shouldShowAll ? 10 : m.defaultVisible;
            let count = 0;

            for (let i = 0; i < 10; i++) {
                if (count >= limit) break;
                if (count >= limit) break;
                if (m === MODE_CA) {
                    if (!row[m.simCols[i]]) continue;
                    let text = row[m.simCols[i]];
                    let score = row[m.simScores[i]] || '';
                    let source = row[m.simSources[i]] || '';
                    const div = document.createElement('div');
                    div.className = `prediction-card ${selIds.includes(String(i + 1)) ? 'selected' : ''}`;
                    div.innerHTML = `<b>Opción ${i + 1} [Similitud: ${score}] [ID Origen: ${source}]</b><br/>${formatWithRef(text)}`;
                    div.onclick = () => toggleMatch(String(i + 1));
                    if (selIds.includes(String(i + 1))) div.style.background = '#ddd';
                    dom.predictionsGrid.appendChild(div);
                    count++;
                } else if (m === MODE_ALUCINACION) {
                    if (!row[m.simCols[i]]) continue;
                    let text = row[m.simCols[i]];
                    let score = row["Similitud Maxima"] || '';
                    let threshold = row["Umbral Dinamico"] || '';
                    const div = document.createElement('div');
                    div.className = 'prediction-card';
                    div.innerHTML = `<b>Mejor Coincidencia Encontrada [Similitud: ${score}] (Umbral de corte: ${threshold})</b><br/>${formatWithRef(text)}`;
                    dom.predictionsGrid.appendChild(div);
                    count++;
                } else {
                    let colData = row[m.simCols[i]];
                    if (!colData) continue;
                    let match = colData.match(/^\[([^\]]+)\]\s*\[([0-9.]+)\]\s*(.*)$/);
                    let idVal = '', scoreVal = '', textVal = colData;
                    if (match) { idVal = match[1]; scoreVal = match[2]; textVal = match[3]; }
                    const div = document.createElement('div');
                    div.className = 'prediction-card';
                    div.innerHTML = `<b>Sugerencia ${i + 1} (ID: ${idVal || '?'}) [Similitud: ${scoreVal}]</b><br/>${formatWithRef(textVal)}`;
                    if (idVal) {
                        div.onclick = () => toggleMatch(idVal);
                        if (selIds.includes(idVal)) div.style.background = '#ddd';
                    }
                    dom.predictionsGrid.appendChild(div);
                    count++;
                }
            }
            if (m.multiSelect && !shouldShowAll && count < 10 && row[m.simCols[m.defaultVisible]]) {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = 'Cargar más opciones (Revisión Completa)';
                btn.onclick = () => renderPredictionsGrid(true);
                dom.predictionsGrid.appendChild(btn);
            }
        }

        function nav(step) {
            let next = appState.currentIndex + step;
            if (next >= 0 && next < appState.rows.length) loadItem(next);
        }
    </script>
</body>

</html>
